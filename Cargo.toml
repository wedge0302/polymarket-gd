[package]
name = "polymarket-copybot"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "1.6.3", features = ["signer-local"] }
anyhow = "1.0"
axum = { version = "0.7", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
dashmap = "6.1"
ethers-core = "2.0"
ethers-signers = "2.0"
futures-util = "0.3"
hex = "0.4"
polymarket_client_sdk_v2 = { version = "0.6.0-canary.1", features = ["clob", "heartbeats"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"
